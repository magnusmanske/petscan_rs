[package]
name = "petscan_rs"
version = "0.1.0"
authors = ["Magnus Manske <magnusmanske@googlemail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
regex = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rayon = "1"
rand = "0.9"
percent-encoding = "2"
async-trait = "0.1"
wikimisc = { git = "https://github.com/magnusmanske/wikimisc" , features = ["sparql", "sparql-client", "wikibase", "lat-lon", "site-matrix", "database", "telemetry", "entity-id", "escape", "http", "jsonp", "logging", "retry", "shutdown", "title"] }
# Reads SPARQL results, which `wikimisc` hands over as a CSV reader.
csv = "1"
tokio = { version = "^1", features = ["macros", "fs", "sync", "signal", "test-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["catch-panic", "cors"] }
futures = "0.3"
tracing = "0.1.40"
rlimit = "0.10"
# Returns freed memory to the OS; see the global allocator in src/bin/main.rs.
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
#target-cpu = "native"
# No `panic = "abort"`: a panic must fail only the request it happened in
# (see `CatchPanicLayer` in src/webserver.rs), not the whole server.
strip = "debuginfo"
